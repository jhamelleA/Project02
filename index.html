<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css"> 
    <title>Giphy Search Project</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <header>
        <button id="logo-btn" aria-label="Home">
            <h1>Giphy Search</h1>
        </button>
        <nav>
            <a href="#" onClick="handleHomeClick()" class="navbtn" id="nav-home">Home</a>
            <a href="#random" onClick="handleRandomClick()" class="navbtn" id="nav-random">Random</a>
            <a href="#contact" onClick="handleContactClick()"  class="navbtn" id="nav-contact">Contact</a>
        </nav>
    </header>

    <main>
        <section id="search-section">
            <form id="searchForm">
                <div>
                    <label for="q">Search Gifs:</label>
                    <input type="text" id="q" placeholder="Enter search phrase" required>
                    <button type="submit" onClick="queryGiphy()">Search</button>
                </div>
            </form>
        </section>

        <section id="outputArea" class="gif-container">
            <p>Type a search phrase and click 'Search' to find Gifs!</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Giphy Search Project</p>
    </footer>
    <script src="js/main.js"></script>
</body>
</html>
