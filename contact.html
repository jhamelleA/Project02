<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet"> 
    <link rel="stylesheet" href="./css/style.css"> 
    <title>Contact Us - Giphy Search Project</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon"> 
</head>
<body>
    <header>
        <button id="logo-btn" aria-label="Home">
            <h1>Giphy Search</h1>
        </button>
        <nav>
            <a href="index.html" class="navbtn" id="nav-home">Home</a>
            <a href="index.html#random" class="navbtn" id="nav-random">Random</a>
            <a href="contact.html" class="navbtn" id="nav-contact">Contact</a>
        </nav>
    </header>

    <main>
        <section id="contact-section">
            <h2>Contact</h2>
        
            <form action="#" method="POST" id="contactForm">
                
                <div>
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                
                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div>
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="6" required></textarea>
                </div>
                
                <div>
                    <button type="submit">Send Message</button>
                </div>

            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Giphy Search Project</p>
    </footer>

    </body>
</html>
